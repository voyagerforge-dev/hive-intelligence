name: Release artefacts

# Build the five released distributions, prove they install and run somewhere that is not the
# machine that built them, and publish them to PyPI.
#
# PUBLICATION IS IRREVERSIBLE. PyPI does not allow re-uploading a version, and yanking one
# does not un-copy what mirrors and caches already took. So the publish jobs are reachable ONLY
# from a pushed `v*` tag - never a pull request, never a manual dispatch - and each additionally
# runs in its own environment, which is where a required reviewer belongs. Their guard tests
# the EVENT as well as the ref, because `workflow_dispatch` accepts a tag as its ref: a ref
# test on its own would let `gh workflow run release.yml --ref v0.5.0` publish. Building and
# installing happen on every trigger; publishing happens only when someone deliberately tags a
# release.
#
# One publish job per distribution, because a PyPI trusted publisher is the tuple (owner,
# repository, workflow, environment) and two distributions cannot share one. `publish` below
# has the whole of that constraint, and `report` is what stops a distribution with no publisher
# yet from disappearing quietly from a release.
#
# No PyPI token exists anywhere, on purpose: this uses Trusted Publishing, where PyPI verifies
# a short-lived OIDC token minted by this workflow for this repository. There is nothing to
# store, nothing to rotate, and nothing for a future maintainer to inherit. If you find
# yourself adding a `PYPI_API_TOKEN` secret, stop: that is a different design and it was
# rejected for a reason.
#
# `docs/architecture/engine-distribution.md` has the decision and what a consumer pins.

on:
  workflow_dispatch:
    inputs:
      trusted_publisher_check:
        description: >-
          Ask PyPI whether it still trusts this repository, and build and publish nothing.
        type: boolean
        default: false
  push:
    tags: ['v*']
  # Path-filtered, unlike fastapi-svcs.yml, and safely so: that workflow feeds the REQUIRED
  # `ci-ok` check, which a filtered workflow would wedge on non-matching PRs by never
  # reporting. This one is not required, so a PR it does not run on is simply a PR that
  # changed no packaging.
  pull_request:
    paths:
      - 'tooling/*/pyproject.toml'
      - 'tools/**'
      - '.github/workflows/release.yml'
      - 'LICENSE'
      - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never on a release tag. A cancel mid-upload leaves some of the five wheels on PyPI and
  # the rest not, and PyPI refuses the re-upload that would finish the job - so that version
  # is burnt. Splitting publication into one job per distribution does not soften this: the
  # group is the whole run, so a cancellation would take every in-flight upload with it.
  # Superseding a pull-request or dispatch run costs nothing, so it keeps happening.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# The floor for every job that does not state its own: read the repository, nothing else. It
# matters because the `pull_request` trigger above is path-filtered on `tools/**`, so `build`
# executes the shell scripts as that pull request edited them. A job-level `permissions:` block
# REPLACES this one rather than adding to it, which is why `publish` below states its whole set
# and inherits none of this: it checks nothing out, so `id-token: write` alone is enough there.
# `report` states none and so inherits this floor: it checks out, and it must never be able to
# publish anything.
# Artifact upload and download use the Actions runtime token, not this one.
permissions:
  contents: read

jobs:
  build:
    # Skipped only by a dispatch that asked for the trusted-publisher check and nothing else,
    # which takes `install` (needs it), `publish` (needs both) and `report` (publish skipped)
    # with it. The first half of the test short-circuits on every other trigger, so a tag push
    # never reads `inputs` at all and the release path is the same one it always was.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.trusted_publisher_check }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tools/build-release.sh reads the tag on HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - id: build
        run: |
          tools/build-release.sh
          version=$(grep -m1 '^version = "' tooling/hive-gen/pyproject.toml \
                    | sed -E 's|^version = "(.*)"$|\1|')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hive-engine-dist
          path: dist/
          if-no-files-found: error

  # The point of the exercise. The current arrangement's defining failure is that it built
  # on one workstation and everyone believed otherwise, so a build that is never installed
  # anywhere else would be the same mistake with newer scripts.
  install:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: hive-engine-dist
          path: dist
      # The set comes from tools/released-packages.sh, the one place it is stated, and is
      # exported for the two steps below, which check the same set rather than a copy of it.
      # A distribution added there is installed and proved here, or the job fails.
      # The five are named as the WHEEL FILES `build` produced, not as `vf-name==version`
      # requirements. A name and a version are also what the index answers, and pip is free to
      # prefer the published copy: with `--find-links dist` it did exactly that once 0.6.0 was
      # on PyPI, and this job proved PyPI's wheels instead of the ones `build` had just made.
      # A file path has one candidate and cannot resolve elsewhere. The filenames are the ones
      # tools/build-release.sh verifies it wrote, so a set that built some other version fails
      # here rather than being installed. Third-party dependencies still come from PyPI.
      - name: Install the released set from the built artefacts only, into a fresh venv
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          . tools/released-packages.sh
          echo "RELEASED_PACKAGES=${RELEASED_PACKAGES[*]}" >> "$GITHUB_ENV"
          wheels=()
          for pkg in "${RELEASED_PACKAGES[@]}"; do
            wheels+=("dist/vf_${pkg//-/_}-$VERSION-py3-none-any.whl")
          done
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --report "$RUNNER_TEMP/report.json" \
            "${wheels[@]}"
          "$RUNNER_TEMP/venv/bin/pip" list | grep -E '^vf-'
      # Where they came from is read from pip's own record rather than assumed from the
      # command above, because this job is the evidence `publish` depends on: an install that
      # resolved a published copy would make it prove nothing.
      - name: Prove the released set came from dist/, not from an index
        env:
          EXPECT_SCHEME: file
        run: python tools/provenance.py "$RUNNER_TEMP/report.json"
      - name: Run them
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # From RUNNER_TEMP, not the checkout: the smoke script refuses a package that
        # resolved to a source tree, and running beside one invites exactly that.
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/tools/smoke-installed.py" \
            --expect-version "$VERSION" \
            --corpus "$GITHUB_WORKSPACE/tooling/hive-serve/tests/fixtures/corpus"

  # Only from a PUSHED tag: the event is half the guard, because a manual dispatch can be run
  # against a tag and would otherwise satisfy a ref-only test. `needs` makes this unreachable
  # unless the artefacts built and then installed and ran somewhere clean, so a release that
  # works only where it was built cannot reach PyPI.
  #
  # ONE JOB PER DISTRIBUTION, because PyPI says so. A trusted publisher is the tuple (owner,
  # repository, workflow, environment), so a second distribution registered against an identical
  # tuple is refused - "A pending trusted publisher matching this configuration has already been
  # registered for a different project name." Five names therefore need five environments, and
  # each job uploads only its own wheel: an identity that may claim one name uploading all of
  # dist/ gets four rejections after the first has already gone out and cannot be recalled.
  #
  # The environment names below are what is registered on PyPI, not a convention to re-derive.
  # A mismatch in any field is not an error message, it is a refused upload. `trusted-publisher-check`
  # at the foot of this file is how that is found out before a tag rather than during one.
  #
  # All five are here now, and the order they arrived in was PyPI's doing: at most three
  # publishers may be PENDING at once ("You can't register more than 3 pending trusted
  # publishers at once"), and one stops being pending only once its project has actually
  # published. So `vf-hive-gen`, `vf-hive-prep` and `vf-hive-serve` went out at 0.5.0 - a run
  # `report` failed on purpose, naming the two that could not - and only then could
  # `vf-hive-dbparse` and `vf-hive-zendesk` be registered. That staging is history; the rule
  # behind it is not. A SIXTH name needs its publisher registered and its environment created
  # before its job is added here, or the job earns a 403 and a GitHub environment that
  # misrepresents itself as configured. 0.5.0 stays a three-of-five release forever: the gap
  # can only be closed by a new version, never by re-running that tag.
  #
  # `fail-fast: false` is load-bearing twice over. One distribution's upload failing must not
  # cancel another's mid-flight - a cancelled upload is the single thing this workflow must
  # never risk - and however many of the set get out, that beats none of them getting out.
  # Naming what did not is `report`'s job, and it fails the run for it.
  publish:
    name: publish ${{ matrix.package }}
    needs: [build, install]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vf-hive-gen
            environment: pypi-vf-hive-gen
          - package: vf-hive-prep
            environment: pypi-vf-hive-prep
          - package: vf-hive-serve
            environment: pypi-vf-hive-serve
          - package: vf-hive-dbparse
            environment: pypi-vf-hive-dbparse
          - package: vf-hive-zendesk
            environment: pypi-vf-hive-zendesk
    # A required reviewer, if one is ever wanted, is configured per environment, so approving
    # one approves one distribution rather than the release.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write   # mint the OIDC token PyPI verifies. No secret, and none is read.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hive-engine-dist
          path: dist
      # tools/build-release.sh already refuses to leave anything but wheels in dist/, and this
      # is the second lock on the same door: whatever is staged here is what goes to PyPI
      # forever. The staging directory is the third: this job may claim exactly one name, so it
      # uploads from a directory that can hold exactly one wheel, and an unexpected count is a
      # refusal rather than a guess.
      - name: Stage exactly the one wheel this job may publish
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          ls -l dist
          test -z "$(find dist -type f ! -name '*.whl')" \
            || { echo "::error::dist/ holds a non-wheel file"; exit 1; }
          prefix="${PACKAGE//-/_}"
          mapfile -t wheels < <(find dist -maxdepth 1 -type f -name "$prefix-*.whl" | sort)
          [ "${#wheels[@]}" -eq 1 ] \
            || { echo "::error::expected one $prefix wheel in dist/, found ${#wheels[@]}"; exit 1; }
          mkdir upload
          cp "${wheels[0]}" upload/
          ls -l upload
      # Version-pinned rather than the `@release/v1` branch PyPA documents: these are the only
      # jobs in the repository that hold a publishing identity, and every other action here and
      # in fastapi-svcs.yml is tag-pinned, so this is the outlier coming into line. Not a commit
      # SHA: this path runs a few times a year, and PyPA publish both this action and the index
      # it uploads to.
      - id: upload
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: upload
      # Read by `report`, which is why it is recorded whatever happened rather than only on
      # success: a job that died before it could say anything reads as not published, which is
      # the direction that sends a human to look at PyPI rather than the direction that claims
      # an upload nobody made.
      - name: Record this distribution's outcome for the report
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          OUTCOME: ${{ steps.upload.outcome }}
        run: mkdir -p outcome && printf '%s %s\n' "$PACKAGE" "$OUTCOME" > outcome/line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-outcome-${{ matrix.package }}
          path: outcome/line
          if-no-files-found: error

  # What did NOT go out is the thing that must not be quiet, because nobody notices a missing
  # distribution until a consumer cannot install it, and by then the version number is spent.
  # This is the only place the whole released set is compared against what this run uploaded,
  # and it takes that set from tools/released-packages.sh - the one place it is stated - so a
  # distribution added there without a publisher is reported, not forgotten. It holds no
  # publishing identity: `contents: read` inherited from the top of the file, no `id-token`.
  #
  # It fails the run whenever anything is missing. Both halves of that matter: whatever could
  # publish did, and the run still ends red naming whatever did not.
  #
  # `always()` rather than `!cancelled()`, deliberately: a run cancelled mid-upload is precisely
  # when a human most needs to be told which wheels are already permanent on PyPI, and
  # `!cancelled()` would skip this job in exactly that case. The `!= 'skipped'` half stays: it
  # is what keeps the report silent on the triggers where nothing was ever published.
  report:
    name: publication report
    needs: [build, publish]
    if: ${{ always() && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: publish-outcome-*
          path: outcomes
      - name: Say which distributions this run published, and fail if any did not
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          . tools/released-packages.sh
          published=$( { find outcomes -type f -name line -exec cat {} + 2>/dev/null || true; } \
                       | awk '$2 == "success" { print $1 }')
          {
            echo "## PyPI publication - ${VERSION:-unknown version}"
            echo
            echo "| distribution | this run |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=()
          for pkg in "${RELEASED_PACKAGES[@]}"; do
            dist="vf-$pkg"
            if grep -qxF "$dist" <<<"$published"; then
              echo "| \`$dist\` | published |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| \`$dist\` | **NOT PUBLISHED** |" >> "$GITHUB_STEP_SUMMARY"
              missing+=("$dist")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            {
              echo
              echo "**${VERSION:-This version} is a partial release.** PyPI never allows a version to be"
              echo "re-uploaded, so the missing distributions cannot be added to it later: register"
              echo "their trusted publishers, then cut a new version. A distribution missing here"
              echo "either has no publisher registered yet or failed its own upload - its job above"
              echo "says which."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Partial release::not published at ${VERSION:-this version}: ${missing[*]}"
            exit 1
          fi
          echo "::notice title=Released::every released distribution published at $VERSION"

  # A CHECK, NOT A RELEASE. This job uploads nothing and cannot: it downloads no artefact,
  # checks nothing out, and never runs pypa/gh-action-pypi-publish. What it does is the first
  # half of what that action does - mint this repository's OIDC token and offer it to PyPI -
  # and then stop and report the HTTP status.
  #
  # It exists because a trusted publisher is the tuple (owner, repository, workflow file,
  # environment) and PyPI additionally pins the numeric OWNER id, so the question "does PyPI
  # still trust us?" has a real answer that reading either side's settings cannot give. The
  # question got sharp on 2026-09-05, when `voyagerforge-dev/hive-intelligence` was deleted and
  # re-created under the same name to clear pre-rewrite pull-request refs: the repository's
  # numeric id changed, every one of the four matched fields did not, and the five GitHub
  # environments were re-created with the same names. That should still match. "Should" is not
  # a thing to learn from a release, because the only cheaper moment to learn it is before one:
  # a refused upload is discovered halfway through an irreversible publish, with some wheels
  # already permanent on the index and the version number spent.
  #
  # THIS JOB MUST STAY IN release.yml. The workflow FILE NAME is one of the four fields PyPI
  # matches, carried in the OIDC token's `job_workflow_ref` claim, so the same steps in a
  # sibling workflow would be refused for the wrong reason - and a check that fails when
  # everything is fine is worse than no check.
  #
  # Run it from the Actions tab, or:
  #   gh workflow run release.yml --ref <branch> -f trusted_publisher_check=true
  #
  # HTTP 200 from every one of the five is the proof. A refusal is a `needs-decision`, not
  # something to fix here: re-registering a publisher happens on PyPI, by a human, and the
  # failing job prints the exact four fields to re-register it with.
  trusted-publisher-check:
    name: trusted publisher check ${{ matrix.package }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.trusted_publisher_check }}
    runs-on: ubuntu-latest
    strategy:
      # One environment refusing must not hide the state of the other four: knowing whether
      # this is one stale publisher or all five is the whole difference between a small fix
      # and a blocked release.
      fail-fast: false
      # Kept deliberately identical to `publish`'s matrix, because a check against a set that
      # has drifted from the set that publishes is a check that proves the wrong thing. A sixth
      # distribution is added to both or neither.
      matrix:
        include:
          - package: vf-hive-gen
            environment: pypi-vf-hive-gen
          - package: vf-hive-prep
            environment: pypi-vf-hive-prep
          - package: vf-hive-serve
            environment: pypi-vf-hive-serve
          - package: vf-hive-dbparse
            environment: pypi-vf-hive-dbparse
          - package: vf-hive-zendesk
            environment: pypi-vf-hive-zendesk
    # The environment name is a matched field, so the check has to run in the environment it is
    # asking about - and running here means a required reviewer, if one is ever added, gates
    # this exactly as it gates the publish.
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write   # mint the OIDC token PyPI verifies. No secret, and none is read.
    steps:
      - name: Ask PyPI whether it still trusts this repository for this distribution
        env:
          PACKAGE: ${{ matrix.package }}
          ENVIRONMENT: ${{ matrix.environment }}
          OWNER_ID: ${{ github.repository_owner_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # TWO CREDENTIALS PASS THROUGH THIS STEP AND NEITHER IS EVER PRINTED: the OIDC token
          # GitHub mints below, and - on success - a real, if short-lived, PyPI upload token
          # for this project. Both are masked the moment they exist, the request body is
          # written to a file rather than a command line, and what is printed is the HTTP
          # status and, on refusal, PyPI's own message. Nothing here echoes a response body.
          umask 077

          # Asked of PyPI rather than hardcoded, exactly as pypa/gh-action-pypi-publish does:
          # a check that assumed the audience would go on quietly passing after PyPI changed it.
          audience=$(curl --silent --show-error --fail \
                       https://pypi.org/_/oidc/audience | jq -r '.audience')
          [ -n "$audience" ] && [ "$audience" != "null" ] \
            || { echo "::error title=$PACKAGE::PyPI did not name an OIDC audience"; exit 1; }

          # The claims PyPI matches a publisher on ride in this token: the repository, the
          # owner's numeric id, the workflow file this job is defined in, and this job's
          # environment.
          oidc=$(curl --silent --show-error --fail \
                   --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                   "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r '.value')
          [ -n "$oidc" ] && [ "$oidc" != "null" ] \
            || { echo "::error title=$PACKAGE::GitHub minted no OIDC token"; exit 1; }
          echo "::add-mask::$oidc"

          # The exchange itself, and the last step this job takes towards PyPI. Uploading would
          # be a further, separate request that nothing here makes.
          jq -cn --arg token "$oidc" '{token: $token}' > "$RUNNER_TEMP/request.json"
          status=$(curl --silent --show-error \
                     --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
                     --header 'Content-Type: application/json' \
                     --data @"$RUNNER_TEMP/request.json" \
                     https://pypi.org/_/oidc/mint-token)
          rm -f "$RUNNER_TEMP/request.json"

          # Read with `|| true` throughout: a proxy error or a maintenance page is not JSON,
          # and this step's job is to report that status, not to die parsing the body.
          minted=$(jq -r '.token // empty' "$RUNNER_TEMP/response.json" 2>/dev/null || true)
          [ -z "$minted" ] || echo "::add-mask::$minted"
          message=$(jq -r '.message // empty' "$RUNNER_TEMP/response.json" 2>/dev/null || true)
          detail=$(jq -r '[.errors[]?.description] | join("; ")' \
                     "$RUNNER_TEMP/response.json" 2>/dev/null || true)
          # The minted token is scoped to this one project and expires on its own in minutes.
          # It is wanted for nothing, so it does not outlive the check.
          rm -f "$RUNNER_TEMP/response.json"

          {
            echo "| distribution | environment | status | trusted publisher |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" = "200" ] && [ -n "$minted" ]; then
            echo "| \`$PACKAGE\` | \`$ENVIRONMENT\` | HTTP 200 | matches |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=$PACKAGE::PyPI accepted this repository's OIDC token (HTTP 200). The trusted publisher still matches. Nothing was uploaded."
            exit 0
          fi

          echo "| \`$PACKAGE\` | \`$ENVIRONMENT\` | HTTP $status | **REFUSED** - ${message:-no message} ${detail} |" \
            >> "$GITHUB_STEP_SUMMARY"
          # Printed on the failing job because it is what a human has to retype into PyPI, and
          # looking it up under pressure is how one of the four fields gets a typo.
          {
            echo
            echo "Re-register this publisher at <https://pypi.org/manage/account/publishing/>"
            echo "with exactly these four fields, then re-run this check:"
            echo
            echo "- PyPI project name: \`$PACKAGE\`"
            echo "- Owner: \`${REPOSITORY%%/*}\` (numeric id \`$OWNER_ID\`)"
            echo "- Repository: \`${REPOSITORY#*/}\`"
            echo "- Workflow: \`release.yml\`"
            echo "- Environment: \`$ENVIRONMENT\`"
            echo
            echo "Do not add a PyPI API token instead. That is a different design and it was"
            echo "rejected for a reason - see docs/architecture/engine-distribution.md."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=$PACKAGE::PyPI refused this repository's OIDC token: HTTP $status - ${message:-no message} ${detail}"
          exit 1
