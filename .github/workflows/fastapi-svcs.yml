name: FastAPI services CI

# Runs on EVERY PR so the required `ci-ok` check always reports. A path-filtered workflow
# does NOT report on non-matching PRs, which would wedge docs-only and OKF card (.md) PRs on
# the required check (they'd wait forever for a run that never happens). The expensive service
# matrix is instead skipped inside detect-services when the PR changed no CI-relevant files,
# so card/docs PRs still cost only the ~10s detect + ci-ok jobs.
on:
  pull_request:

# A new push to the same PR cancels the in-flight run instead of stacking runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base commit to diff the PR's changed files
      - id: find
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run the service matrix only when the PR touches CI-relevant files (service code /
          # tests / packaging / Dockerfiles / this workflow). Docs- or card-only PRs emit an
          # empty matrix — which ci-ok treats as success — but the workflow still RAN, so the
          # required ci-ok check is always reported (no wedge on .md-only PRs).
          if git diff --name-only "$BASE_SHA"...HEAD \
             | grep -qE '(\.py$|/tests/|/pyproject\.toml$|(^|/)Dockerfile$|^\.github/workflows/fastapi-svcs\.yml$)'; then
            # Discover services with a pyproject.toml across all service roots
            #   (infra-repo/hosts/host-a/docker/, connectors/, knowledge/, automation/).
            # Emits the FULL relative dir path (used directly as working-directory); each path is
            # validated against a strict regex before hitting GITHUB_OUTPUT so no pathological
            # directory name can poison the matrix interpolation.
            services=$(
              find infra-repo/hosts/host-a/docker connectors knowledge automation \
                -path '*/.venv' -prune -o -name pyproject.toml -printf '%h\n' \
              | sort -u \
              | grep -E '^[a-z][a-z0-9/-]{1,127}$' \
              | jq -R . | jq -sc .
            )
          else
            echo "No CI-relevant files changed — skipping the service matrix."
            services="[]"
          fi
          if [ -z "$services" ]; then services="[]"; fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Detected: $services"

  test:
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: ${{ fromJSON(needs.detect-services.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # Install linters at the job level so `ruff`/`mypy` exist regardless of whether a
      # given service lists them in its own [dev] extras. Each service still supplies its
      # own ruff/mypy CONFIG via pyproject.toml (line-length, ignores, target-version).
      - name: Install lint/type tooling
        run: pip install "ruff>=0.7" "mypy>=1.10"
      # okf-serve/okf-author depend on the in-repo `okfgen` via [tool.uv.sources]. Plain pip
      # does not read that table and would otherwise pull a SAME-NAMED package from PyPI
      # (which exists and is not ours), so install any local path source first (editable) to
      # pin the in-repo package before the service resolves its dependencies.
      - name: Install local path dependencies (tool.uv.sources)
        working-directory: ${{ matrix.svc }}
        run: |
          python - <<'PY'
          import subprocess, sys, tomllib
          data = tomllib.load(open("pyproject.toml", "rb"))
          for name, spec in data.get("tool", {}).get("uv", {}).get("sources", {}).items():
              if isinstance(spec, dict) and spec.get("path"):
                  print(f"installing in-repo source {name} from {spec['path']}")
                  subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", spec["path"]])
          PY
      - name: Install service + dev deps
        working-directory: ${{ matrix.svc }}
        run: pip install -e ".[dev]"
      # `ruff check .` is layout-agnostic — services use either src/ or a named package
      # dir (okfgen/, okfserve/, …). Ruff reads the nearest pyproject for config/excludes.
      - name: Lint (ruff)
        working-directory: ${{ matrix.svc }}
        run: ruff check .
      # Type-check services that opt in by mentioning mypy in pyproject (a [tool.mypy]
      # section and/or a mypy dev dep). All services now carry a lenient [tool.mypy]
      # (ignore_missing_imports), so this runs on every service; a future service without
      # any mypy mention is simply skipped rather than failing on missing config.
      - name: Type check (mypy — opt-in)
        working-directory: ${{ matrix.svc }}
        run: |
          if grep -qi 'mypy' pyproject.toml; then
            if [ -d src ]; then tgt=src
            else tgt=$(find . -maxdepth 2 -name __init__.py -printf '%h\n' \
                       | sed 's#^\./##' | grep -vE '^(tests|deploy)' | sort -u | head -1); fi
            [ -z "$tgt" ] && tgt=.
            echo "mypy $tgt"; mypy "$tgt"
          else
            echo "mypy not declared in pyproject.toml — skipping type check for this service."
          fi
      - name: Tests (pytest)
        working-directory: ${{ matrix.svc }}
        env:
          SVC_NAME: ${{ matrix.svc }}
          BEARER_TOKEN: "test-token-padded-to-thirty-two-chars"
        run: |
          if [ -d tests ]; then pytest -v; else echo "no tests/ — skipping."; fi
      # Not every service ships a container (the OKF tooling packages are libraries).
      - name: Verify Dockerfile builds (only if present)
        working-directory: ${{ matrix.svc }}
        env:
          SVC: ${{ matrix.svc }}
        run: |
          if [ -f Dockerfile ]; then docker build -t "${SVC##*/}:ci" .; else echo "no Dockerfile — skipping build."; fi

  # Single aggregate status for branch protection. Requiring this one context — instead of
  # every dynamic `test (<svc>)` matrix leg — keeps the required-check list stable as services
  # are added or removed. `always()` so it still reports when a matrix leg fails; a skipped
  # matrix (detect-services found no services) is treated as OK.
  ci-ok:
    needs: [detect-services, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require detect-services + all matrix jobs to have passed
        run: |
          echo "detect-services: ${{ needs.detect-services.result }}"
          echo "test matrix:     ${{ needs.test.result }}"
          if [ "${{ needs.detect-services.result }}" != "success" ]; then
            echo "::error::detect-services did not succeed"; exit 1
          fi
          case "${{ needs.test.result }}" in
            success|skipped) echo "matrix OK" ;;
            *) echo "::error::test matrix did not succeed"; exit 1 ;;
          esac
