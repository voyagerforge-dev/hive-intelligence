name: FastAPI services CI

on:
  push:
    paths:
      - 'infra-repo/hosts/host-c/docker/psr-svc/**'
      - 'infra-repo/hosts/host-c/docker/support-svc/**'
      - 'infra-repo/hosts/host-c/docker/wms-svc/**'
      - 'infra-repo/hosts/host-c/docker/timelog-svc/**'
      - 'infra-repo/hosts/host-c/docker/timesheet-validator/**'
      - 'infra-repo/hosts/host-c/docker/triage-svc/**'
      - 'infra-repo/templates/fastapi-svc/**'
      - '.github/workflows/fastapi-svcs.yml'
  pull_request:
    paths:
      - 'infra-repo/hosts/host-c/docker/*/pyproject.toml'
      - 'infra-repo/hosts/host-c/docker/*/src/**'
      - 'infra-repo/hosts/host-c/docker/*/tests/**'

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.find.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Discover services with a pyproject.toml under infra-repo/hosts/host-c/docker/
          # All input is from repo filesystem; service names validated against a strict regex
          # before being emitted to GITHUB_OUTPUT to prevent any pathological directory names
          # from poisoning downstream matrix interpolation.
          services=$(
            find infra-repo/hosts/host-c/docker -maxdepth 2 -name pyproject.toml -printf '%h\n' \
            | sed 's|infra-repo/hosts/host-c/docker/||' \
            | grep -E '^[a-z][a-z0-9-]{1,63}$' \
            | jq -R . | jq -sc .
          )
          if [ -z "$services" ] || [ "$services" = "[]" ]; then
            echo "No services with pyproject.toml found."
            services="[]"
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "Detected: $services"

  test:
    needs: detect-services
    if: needs.detect-services.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc: ${{ fromJSON(needs.detect-services.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install svc + dev deps
        working-directory: infra-repo/hosts/host-c/docker/${{ matrix.svc }}
        run: |
          pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: infra-repo/hosts/host-c/docker/${{ matrix.svc }}
        run: ruff check src tests
      - name: Type check (mypy)
        working-directory: infra-repo/hosts/host-c/docker/${{ matrix.svc }}
        run: mypy src
      - name: Tests (pytest with coverage)
        working-directory: infra-repo/hosts/host-c/docker/${{ matrix.svc }}
        env:
          SVC_NAME: ${{ matrix.svc }}
          BEARER_TOKEN: "test-token-padded-to-thirty-two-chars"
        run: pytest -v
      - name: Verify Dockerfile builds
        working-directory: infra-repo/hosts/host-c/docker/${{ matrix.svc }}
        env:
          SVC: ${{ matrix.svc }}
        run: docker build -t "${SVC}:ci" .
