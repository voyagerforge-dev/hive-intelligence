[project]
name = "vf-hive-dbparse"
version = "0.6.0"
description = "Deterministic parser: Oracle and DB2 DDL to OKF database-object cards"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["sqlglot>=25", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
hivedbparse = "hivedbparse.run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hivedbparse"]
