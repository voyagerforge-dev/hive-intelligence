# Example deployment of hive-author.
#
# Copy this file, change the marked values, and keep your copy with your infrastructure rather than
# in this repository. See docs/architecture/product-deployment-boundary.md for why.

# Explicit project name. Both hive-serve and hive-author live in a directory called `deploy`, which
# would otherwise collide on the default compose project name, and let `down --remove-orphans` in
# one remove the other.
name: hive-author

services:
  hive-author:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: hive-author:latest
    container_name: hive-author
    restart: unless-stopped

    # hive-author holds a forge credential, unlike hive-serve. Scope it to issues:write on the
    # single corpus repository and nothing else: this service opens card submissions as issues and
    # needs no other access. Keep this file outside the git checkout.
    env_file: [./hive-author.env]

    environment:
      HOST: 0.0.0.0
      PORT: "8016"

      # Which forge this deployment files against. No default, and not inferred from FORGE_API:
      # GitHub takes label names where Forgejo takes integer IDs, so guessing wrong fails the
      # submission at the moment somebody is waiting on it.
      FORGE_KIND: github            # or: forgejo
      FORGE_API: https://api.github.com
      FORGE_REPO: owner/corpus-repo

      # Either FORGE_TOKEN in the env file, or FORGE_TOKEN_FILE here. The file exists for
      # GitHub App installation tokens, which last an hour while this container runs for days:
      # something outside mints one and rewrites the file, and the client re-reads it per
      # submission. Mount it read-only from tmpfs; do not bake a token into the image.
      FORGE_TOKEN_FILE: /run/forge/token

    # Defaults to loopback. hive-author trusts an upstream identity header and does not authenticate
    # callers itself, so put an authenticating proxy in front before exposing it beyond the host.
    ports: ["${BIND:-127.0.0.1:8016}:8016"]

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8016/healthz').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
