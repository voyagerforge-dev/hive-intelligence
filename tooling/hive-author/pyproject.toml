[project]
name = "vf-hive-author"
version = "0.1.0"
description = "Write-only MCP server: file OKF memory/correction issues (keeps hive-serve keyless)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.5", "mcp==1.28.1", "fastapi>=0.135", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
hiveauthor = "hiveauthor.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "vf-hive-gen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiveauthor"]

# hivegen is a DEV-ONLY dep: the round-trip tests load the hive-gen Issue-Form parsers to
# prove hive-author's issue bodies parse back losslessly. Portable relative source (mirrors
# hive-serve) so it survives worktree removal / any checkout, never an absolute path.
[tool.uv.sources]
vf-hive-gen = { path = "../hive-gen", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
