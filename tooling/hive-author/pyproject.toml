[project]
name = "vf-hive-author"
version = "0.1.0"
description = "Write-only MCP server: file OKF memory/correction issues (keeps hive-serve keyless)"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "prometheus-client>=0.20","pydantic>=2.9", "pydantic-settings>=2.5", "mcp==1.28.1", "fastapi>=0.135", "uvicorn>=0.30", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/voyagerforge-dev/hive-intelligence"
Documentation = "https://github.com/voyagerforge-dev/hive-intelligence/blob/main/docs/reference/hive-author.md"
Source = "https://github.com/voyagerforge-dev/hive-intelligence"
Issues = "https://github.com/voyagerforge-dev/hive-intelligence/issues"
"Release notes" = "https://github.com/voyagerforge-dev/hive-intelligence/releases"

[project.scripts]
hiveauthor = "hiveauthor.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "vf-hive-gen"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiveauthor"]

# hivegen is a DEV-ONLY dep: the round-trip tests load the hive-gen Issue-Form parsers to
# prove hive-author's issue bodies parse back losslessly. Portable relative source (mirrors
# hive-serve) so it survives worktree removal / any checkout, never an absolute path.
[tool.uv.sources]
vf-hive-gen = { path = "../hive-gen", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
