[project]
name = "vf-hive-zendesk"
version = "0.6.0"
description = "Distil closed Zendesk tickets -> OKF client issue cards"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "pydantic>=2.9", "pydantic-settings>=2.5",
                "boto3>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7"]

[project.scripts]
hivezendesk = "hivezendesk.run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hivezendesk"]
