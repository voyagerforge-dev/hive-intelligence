[project]
# Distribution name is namespaced to avoid a collision with an unrelated PyPI package
# named "hivegen". The IMPORT package remains `hivegen` (see tool.hatch packages below);
# consumers still `import hivegen`, but pip resolves the dependency as `vf-hive-gen`.
name = "vf-hive-gen"
version = "0.6.0"
description = "Generate OKF concept cards from a prepared reference corpus"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["httpx>=0.27", "boto3>=1.35", "pydantic>=2.9", "pydantic-settings>=2.5", "PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/voyagerforge-dev/hive-intelligence"
Documentation = "https://github.com/voyagerforge-dev/hive-intelligence/blob/main/docs/reference/hive-gen.md"
Source = "https://github.com/voyagerforge-dev/hive-intelligence"
Issues = "https://github.com/voyagerforge-dev/hive-intelligence/issues"
"Release notes" = "https://github.com/voyagerforge-dev/hive-intelligence/releases"

# The command line over the library, so a consumer that pins this distribution gets both.
# Until 0.7.0 these lived in `scripts/` beside the package and no artifact carried them, so
# the corpus repository read the wrappers off a hand-seeded checkout on a host while
# importing the pinned `hivegen` underneath. Names are `hivegen-` prefixed because a console
# script lands on a shared PATH and `index-generate` is not a name this project may claim.
# `tests/test_console_scripts.py` builds the wheel and fails on one declared here that does
# not resolve, or a module under `hivegen/scripts/` with no name here.
[project.scripts]
hivegen-conformance-pass = "hivegen.scripts.conformance_pass:main"
hivegen-correction-from-issue = "hivegen.scripts.correction_from_issue:main"
hivegen-corrections-lint = "hivegen.scripts.corrections_lint:main"
hivegen-index-generate = "hivegen.scripts.index_generate:main"
hivegen-memory-conflict-score = "hivegen.scripts.memory_conflict_score:main"
hivegen-memory-from-issue = "hivegen.scripts.memory_from_issue:main"
hivegen-memory-lint = "hivegen.scripts.memory_lint:main"
hivegen-pr-conflict-gate = "hivegen.scripts.pr_conflict_gate:main"

[project.optional-dependencies]
# hatchling is a TEST dependency, not only the build backend: test_console_scripts.py calls
# its PEP 517 hook in-process to build a real wheel, which keeps that test offline and out
# of build isolation. CI installs this extra with plain pip and has no uv to build with.
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7", "hatchling>=1.25"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hivegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E702"]  # deliberate compact statement style (a; b on one line)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # tests import modules after fixture/setup blocks

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
