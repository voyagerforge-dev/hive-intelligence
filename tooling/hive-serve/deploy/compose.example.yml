# Example deployment of hive-serve.
#
# Copy this file, change the marked values, and keep your copy with your infrastructure rather than
# in this repository. See docs/architecture/product-deployment-boundary.md for why.
#
#   CORPUS_DIR   directory of OKF concept cards to serve. Required.
#   CLIENTS_DIR  directory of client-scoped memory cards. Optional; omit the mount to disable.
#   LEDGER_DSN   Postgres connection string for the objectives and memory ledger. Required.
#                A `ledger-db` service is included below; point this at your own Postgres
#                instead if the platform already manages one.
#   BIND         address:port to expose. Use 127.0.0.1 unless something in front terminates TLS.

services:
  # The ledger. Postgres since 2026-08-19; it was a SQLite file in a bind mount before.
  #
  # It moved for one reason: it is the only mutable state this service holds, and a managed
  # platform backs up a database it manages and does not back up a file in a volume. Being a
  # database is what makes it get backed up.
  #
  # If your platform already provides Postgres, delete this service and point LEDGER_DSN at
  # that instead. Nothing here depends on it being local.
  ledger-db:
    image: postgres:16-alpine
    container_name: hive-ledger-db
    environment:
      POSTGRES_USER: ${LEDGER_USER:-hive}
      POSTGRES_PASSWORD: ${LEDGER_PASSWORD:?set LEDGER_PASSWORD}
      POSTGRES_DB: ${LEDGER_DB:-hive_ledger}
    volumes:
      - ledger-data:/var/lib/postgresql/data
    # Unpublished on purpose: only hive-serve talks to it, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_USER:-hive} -d ${LEDGER_DB:-hive_ledger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hive-serve:
    build:
      # Context is the repository root so the image can install both hivegen and hiveserve.
      context: ../../..
      dockerfile: tooling/hive-serve/deploy/Dockerfile
    container_name: hive-serve
    depends_on:
      ledger-db:
        # service_healthy, not service_started. hive-serve creates its schema on the first
        # connection, so starting before Postgres accepts connections fails at boot rather
        # than retrying.
        condition: service_healthy

    # hive-serve makes no LLM calls and holds no credentials, so there is no secret file here.
    # This is for non-secret overrides only: see .env.example for the recognised keys.
    env_file: [./hive-serve.env]

    volumes:
      # Card corpus, read-only and read live. No rebuild is needed when cards change; whatever keeps
      # this directory fresh is your choice (a git pull on a timer, a sync job, a mounted volume).
      - ${CORPUS_DIR:?set CORPUS_DIR to your card corpus}:/data/concepts:ro

      # Client-scoped memory. Scoped at serve time: cards for the client selected on a request
      # never arrive alongside another client's. That is retrieval scope, NOT access control -
      # the client is chosen by the caller, and anyone who can read this directory can read all
      # of it. Omit this mount if you are not using client memory.
      - ${CLIENTS_DIR:-/dev/null}:/data/clients:ro

    ports:
      # Defaults to loopback. Bind to a LAN address only if the network is trusted, and put an
      # authenticating proxy in front before exposing this beyond the host: hive-serve trusts the
      # identity header named by IDENTITY_HEADER and does not authenticate callers itself.
      - "${BIND:-127.0.0.1:8015}:8000"

    restart: unless-stopped
    healthcheck:
      # Liveness only. This reports ok on an empty corpus, so it will not tell you that a corpus
      # mount has gone stale. Alert on the card count from /metrics instead.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # The only state in this stack that does not survive in git, and the whole reason the
  # ledger stopped being a file in a bind mount: a managed platform backs up a database it
  # manages, and does not back up a volume you happen to have mounted.
  ledger-data:
