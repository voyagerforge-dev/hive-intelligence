[project]
name = "vf-hive-serve"
version = "0.1.0"
description = "Serve + test OKF concept cards as agent context (no RAG)"
requires-python = ">=3.12"
dependencies = ["vf-hive-gen", "pydantic>=2.9", "pydantic-settings>=2.5", "PyYAML>=6.0", "mcp==1.28.1", "fastapi>=0.135", "uvicorn>=0.30", "prometheus_client>=0.20"]

[project.scripts]
hiveserve = "hiveserve.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "httpx>=0.27"]

[tool.uv.sources]
vf-hive-gen = { path = "../hive-gen", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hiveserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["E702"]  # deliberate compact statement style (a; b on one line)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # tests import modules after fixture/setup blocks

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
