[project]
name = "okfzendesk"
version = "0.1.0"
description = "Distil closed Zendesk tickets -> OKF client issue cards"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "pydantic>=2.9", "pydantic-settings>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7"]

[project.scripts]
okfzendesk = "okfzendesk.run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okfzendesk"]
