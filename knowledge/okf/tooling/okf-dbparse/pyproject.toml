[project]
name = "okfdbparse"
version = "0.1.0"
description = "Deterministic parser: WMOS Oracle/DB2 DDL -> OKF database-object cards"
requires-python = ">=3.12"
dependencies = ["sqlglot>=25", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
okfdbparse = "okfdbparse.run:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okfdbparse"]
