[project]
name = "okfauthor"
version = "0.1.0"
description = "Write-only MCP server: file OKF memory/correction issues (keeps okf-serve keyless)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.5", "mcp==1.28.1", "fastapi>=0.135", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
okfauthor = "okfauthor.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "okfgen @ file:///home/user/Documents/github/project-hive-wt-okf-memory-3d/knowledge/okf/tooling/okf-gen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okfauthor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"
