[project]
name = "okfauthor"
version = "0.1.0"
description = "Write-only MCP server: file OKF memory/correction issues (keeps okf-serve keyless)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.5", "mcp==1.28.1", "fastapi>=0.135", "uvicorn>=0.30", "httpx>=0.27"]

[project.scripts]
okfauthor = "okfauthor.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7", "okfgen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okfauthor"]

# okfgen is a DEV-ONLY dep: the round-trip tests load the okf-gen Issue-Form parsers to
# prove okf-author's issue bodies parse back losslessly. Portable relative source (mirrors
# okf-serve) so it survives worktree removal / any checkout — never an absolute path.
[tool.uv.sources]
okfgen = { path = "../okf-gen", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
