[project]
name = "okfprep"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "PyYAML>=6.0",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.7"]

[project.scripts]
okfprep = "okfprep.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["okfprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
